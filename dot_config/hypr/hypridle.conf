general {
    lock_cmd = pidof hyprlock || /run/current-system/sw/bin/hyprlock
    before_sleep_cmd = loginctl lock-session
}

listener {
    timeout = 420
    on-timeout = loginctl lock-session
}

listener {
    timeout = 421
    on-timeout = /run/current-system/sw/bin/hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = /run/current-system/sw/bin/hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# Battery only: systemd-ac-power exits 0 on AC, short-circuiting the action.
listener {
    timeout = 180
    on-timeout = systemd-ac-power || /run/current-system/sw/bin/hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = /run/current-system/sw/bin/hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 900
    on-timeout = systemd-ac-power || systemctl suspend-then-hibernate
}
