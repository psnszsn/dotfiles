# Hyprland color temperature schedule (replaces gammastep).
# https://wiki.hypr.land/Hypr-Ecosystem/hyprsunset/
#
# NOTE: hyprsunset uses fixed clock times, not solar lat/lon like gammastep did.
# These are a year-round compromise for Amsterdam (sunset ~16:30 winter / ~22:00
# summer) — adjust the `time =` values to taste.

max-gamma = 150

# Daytime: no color shift (full 6500K daylight).
profile {
    time = 6:30
    identity = true
}

# Evening: warm to 4500K (matches gammastep's default night temperature).
profile {
    time = 20:30
    temperature = 4500
}
